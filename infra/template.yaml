AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  BillSahi - checks an Indian hospital or pharmacy bill against NPPA published
  price ceilings. Everything here is serverless and scales to zero: there is no
  VPC, no NAT Gateway, no provisioned capacity, and nothing that costs money
  while idle.

# ---------------------------------------------------------------------------
# COST NOTES, because $100 of credits is the whole budget.
#
#   No VPC          -> no NAT Gateway. A NAT is ~$32-45/month and is the single
#                      most common way a hackathon burns its credits.
#   DynamoDB        -> PAY_PER_REQUEST. Never provisioned.
#   S3              -> lifecycle deletes uploads after 1 day.
#   Logs            -> 7-day retention. Log storage is a slow leak otherwise.
#   Concurrency     -> capped at 5 on the function that calls Textract and
#                      Bedrock, so a retry storm costs five calls, not a
#                      thousand. A hard platform limit, not our retry logic
#                      being correct.
# ---------------------------------------------------------------------------

Parameters:
  BedrockInferenceProfileId:
    Type: String
    Default: ""
    Description: >
      Inference profile ID, copied VERBATIM from the Bedrock console in
      us-east-1 (e.g. us.anthropic.claude-... or global.anthropic.claude-...).
      Leave empty to run with Textract only -- the app degrades to a single
      reader and applies a stricter confidence bar rather than failing.
      When set it is PINNED INTO THE IAM POLICY, so a typo here surfaces as
      AccessDeniedException on the first call, not as a wrong model.

  FrontendOrigin:
    Type: String
    Default: ""
    Description: >
      The Amplify origin, e.g. https://main.d111111abcdef8.amplifyapp.com.
      Added to the CORS allowlist. Never "*": the API returns a user's bill.

  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Hard ceiling on concurrent executions. See cost notes.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    Timeout: 60
    Architectures: [arm64]      # cheaper per ms than x86_64
    Environment:
      Variables:
        PROVIDER: aws
        AWS_REGION_NAME: !Ref AWS::Region
        S3_BUCKET: !Ref UploadBucket
        DDB_TABLE: !Ref BillsTable
        BEDROCK_INFERENCE_PROFILE_ID: !Ref BedrockInferenceProfileId
        FRONTEND_ORIGIN: !Ref FrontendOrigin

Conditions:
  HasBedrockProfile: !Not [!Equals [!Ref BedrockInferenceProfileId, ""]]
  # Section 3 deploys with FrontendOrigin blank, because Amplify does not
  # exist yet. An empty string is not a valid CORS origin, so the whole
  # CorsConfiguration is omitted until Section 4 supplies a real one. The app
  # enforces CORS itself either way; the gateway config is an optimisation.
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, ""]]

Resources:

  # -------------------------------------------------------------------------
  # Uploads. Private, encrypted, and gone within a day.
  # -------------------------------------------------------------------------
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # A patient's bill is not ours to keep. One day is long enough to
          # process it and short enough to be defensible.
          - Id: DeleteUploadsAfterOneDay
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # -------------------------------------------------------------------------
  # Bill records. On-demand, and they expire with the uploads they describe.
  # -------------------------------------------------------------------------
  BillsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bill_id
          AttributeType: S
      KeySchema:
        - AttributeName: bill_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------------------
  # The API. One Lambda, FastAPI behind Mangum.
  # -------------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.handler
      Description: BillSahi API - reads, verifies and audits a bill
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Policies:
        # Least privilege, written out rather than using a managed policy so
        # that every permission granted is visible on one screen.
        - Statement:
            - Sid: ReadWriteUploads
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Sid: ReadWriteBillRecords
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt BillsTable.Arn
            - Sid: ReadBillsWithTextract
              Effect: Allow
              Action:
                - textract:AnalyzeExpense
              Resource: "*"   # Textract's action is not resource-scoped
        - !If
          - HasBedrockProfile
          - Statement:
              # -------------------------------------------------------------
              # SCOPED TO THE INFERENCE PROFILE, and it needs TWO resource
              # types, not one. This is the least obvious IAM shape in the
              # stack, so the reason is written down rather than rediscovered.
              #
              # AWS docs, "Prerequisites for inference profiles":
              #   "When you specify an inference profile in the Resource field
              #    in the first statement, you must also specify the
              #    foundation model in each Region associated with it."
              #
              # So granting ONLY the profile ARN -- the intuitive "least
              # privilege" move -- produces AccessDeniedException at the first
              # call. The profile is a routing target; the model is what is
              # actually invoked.
              #
              # The profile is pinned to the exact ID supplied at deploy time.
              #
              # The foundation models are pinned to the THREE Regions the
              # US geo profile routes to from us-east-1: us-east-1,
              # us-east-2, us-west-2.
              # That list is safe to hardcode because AWS guarantees it:
              #   "if an inference profile is tied to a geography (such as US,
              #    EU, or APAC), its destination Region list will never change."
              # The GLOBAL profile would have to stay wildcarded instead --
              # its destinations are 33 Regions and they DO change.
              #
              # This is also the data-residency control. A patient's bill
              # cannot be routed outside these three Regions, because no
              # policy here permits invoking the model anywhere else.
              #
              # InvokeModel* (not InvokeModel) because the reader uses the
              # Converse API, which authorises against bedrock:InvokeModel.
              # -------------------------------------------------------------
              - Sid: InvokeClaudeThroughTheUsGeoProfileOnly
                Effect: Allow
                Action:
                  - bedrock:InvokeModel*
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/*"
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 7

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS is also enforced in the app. Declaring it here too means a
      # preflight never reaches Lambda, which is faster and cheaper. Omitted
      # entirely until FrontendOrigin is known -- never "*", because this API
      # hands back a user's uploaded bill.
      CorsConfiguration: !If
        - HasFrontendOrigin
        - AllowOrigins: [!Ref FrontendOrigin]
          AllowMethods: [GET, POST, PUT, OPTIONS]
          AllowHeaders: [Content-Type]
          MaxAge: 600
        - !Ref AWS::NoValue

Outputs:
  ApiUrl:
    Description: Base URL for the API. Put this in the frontend's VITE_API_BASE.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UploadBucketName:
    Description: Uploads land here and are deleted after one day.
    Value: !Ref UploadBucket

  BillsTableName:
    Description: Bill records, TTL one day.
    Value: !Ref BillsTable

  FunctionName:
    Description: Use with `sam logs -n` to tail the API logs.
    Value: !Ref ApiFunction
