AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  BillWise - checks an Indian hospital or pharmacy bill against NPPA published
  price ceilings. Everything here is serverless and scales to zero: there is no
  VPC, no NAT Gateway, no provisioned capacity, and nothing that costs money
  while idle.

# ---------------------------------------------------------------------------
# COST NOTES. Idle cost is what kills a small budget, so it is designed out:
#
#   No VPC      -> no NAT Gateway. A NAT is ~$32-45/month and is the most
#                  common way a small AWS budget disappears.
#   DynamoDB    -> PAY_PER_REQUEST. Never provisioned.
#   S3          -> uploads deleted after 1 day by lifecycle rule.
#   Logs        -> 7-day retention. Log storage is a slow leak otherwise.
#   Concurrency -> see the ReservedConcurrency parameter below.
#
# The variable cost is per upload: Textract bills per page and Bedrock per
# token. An idle stack costs almost nothing; a busy one is not free.
# ---------------------------------------------------------------------------

Parameters:
  BedrockInferenceProfileId:
    Type: String
    Default: ""
    Description: >
      Inference profile ID, copied VERBATIM from the Bedrock console in
      us-east-1 (e.g. us.anthropic.claude-... or global.anthropic.claude-...).
      Leave empty to run with Textract only -- the app degrades to a single
      reader and applies a stricter confidence bar rather than failing.
      When set it is PINNED INTO THE IAM POLICY, so a typo here surfaces as
      AccessDeniedException on the first call, not as a wrong model.

  FrontendOrigin:
    Type: String
    Default: ""
    Description: >
      The Amplify origin, e.g. https://main.d111111abcdef8.amplifyapp.com.
      Added to the CORS allowlist. Never "*": the API returns a user's bill.

  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Hard ceiling on concurrent executions, or 0 to set NO reservation.

      Default 0, and that is not laziness. AWS refuses any reservation that
      would drop the account's UNRESERVED concurrency below 10. A new account
      often has a total concurrency limit of 10, so reserving even 1 is
      rejected with "decreases account's UnreservedConcurrentExecution below
      its minimum value of [10]" and the whole stack rolls back.

      On such an account the cost control is not lost: the ACCOUNT limit is
      already a harder cap than the 5 we wanted. A retry storm cannot exceed
      the account's own ceiling.

      Set this to 5 only after raising the account's Lambda concurrency quota
      (Service Quotas -> Lambda -> Concurrent executions) well above 10.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    Timeout: 60
    # x86_64, NOT arm64, and this is a deliberate downgrade.
    #
    # arm64 Lambda is ~20% cheaper per millisecond, which is why this was
    # arm64 originally. That assumed an ARM builder. The build machine is
    # x86_64, so `sam build --use-container` has to emulate ARM through QEMU
    # to compile the two native wheels (pydantic-core, rapidfuzz). SAM warns
    # about it: "Cross-architecture build detected ... may cause build
    # failures", and in practice the build container can exit silently with no
    # output at all -- the signature of the OOM killer, when Docker's memory
    # cap is mostly spoken for already.
    #
    # 20% of a function that processes a handful of bills is a fraction of a
    # cent. A build that does not complete costs the deadline. Matching the
    # Lambda architecture to the builder removes the emulation entirely: no
    # QEMU, far less memory, much faster builds.
    #
    # Revisit only if this ever builds on an ARM host (Graviton CI, Apple
    # silicon), where arm64 becomes free of this problem and worth taking.
    Architectures: [x86_64]
    Environment:
      Variables:
        PROVIDER: aws
        AWS_REGION_NAME: !Ref AWS::Region
        S3_BUCKET: !Ref UploadBucket
        DDB_TABLE: !Ref BillsTable
        BEDROCK_INFERENCE_PROFILE_ID: !Ref BedrockInferenceProfileId
        FRONTEND_ORIGIN: !Ref FrontendOrigin

Conditions:
  HasBedrockProfile: !Not [!Equals [!Ref BedrockInferenceProfileId, ""]]
  # Section 3 deploys with FrontendOrigin blank, because Amplify does not
  # exist yet. An empty string is not a valid CORS origin, so the whole
  # CorsConfiguration is omitted until Section 4 supplies a real one. The app
  # enforces CORS itself either way; the gateway config is an optimisation.
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, ""]]
  # 0 means "do not reserve". The property must then be OMITTED entirely --
  # passing 0 would mean "reserve zero concurrency", i.e. the function can
  # never run at all. AWS::NoValue removes the property; 0 would disable the
  # API. That distinction is the whole reason this condition exists.
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:

  # -------------------------------------------------------------------------
  # Uploads. Private, encrypted, and gone within a day.
  # -------------------------------------------------------------------------
  UploadBucket:
    Type: AWS::S3::Bucket
    # Explicit on both, so `sam delete` cannot leave an orphaned bucket of
    # other people's bills behind. Nothing here is worth keeping: uploads
    # expire after a day anyway.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # A patient's bill is not ours to keep. One day is long enough to
          # process it and short enough to be defensible.
          - Id: DeleteUploadsAfterOneDay
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # -------------------------------------------------------------------------
  # Bill records. On-demand, and they expire with the uploads they describe.
  # -------------------------------------------------------------------------
  BillsTable:
    Type: AWS::DynamoDB::Table
    # Records expire by TTL after a day, so there is nothing to preserve and
    # an orphaned table would just cost money. Stated rather than defaulted.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bill_id
          AttributeType: S
      KeySchema:
        - AttributeName: bill_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------------------
  # The API. One Lambda, FastAPI behind Mangum.
  # -------------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.handler
      Description: BillWise API - reads, verifies and audits a bill
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Policies:
        # Least privilege, written out rather than using a managed policy so
        # that every permission granted is visible on one screen.
        - Statement:
            - Sid: ReadWriteUploads
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Sid: ReadWriteBillRecords
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt BillsTable.Arn
            - Sid: ReadBillsWithTextract
              Effect: Allow
              Action:
                - textract:AnalyzeExpense
              Resource: "*"   # Textract's action is not resource-scoped
        - !If
          - HasBedrockProfile
          - Statement:
              # -------------------------------------------------------------
              # Scoped to the inference profile -- and it needs TWO resource
              # types, not one. Granting only the profile ARN is the intuitive
              # least-privilege move and fails at the first call, because the
              # profile is a routing target while the model is what is
              # actually invoked. AWS docs, "Prerequisites for inference
              # profiles": "you must also specify the foundation model in
              # each Region associated with it."
              #
              # The three Regions are safe to hardcode because AWS guarantees
              # a geo-tied profile's destination list never changes. THIS IS
              # THE DATA-RESIDENCY CONTROL: no policy here permits invoking
              # the model anywhere else, so a bill cannot be routed outside
              # them. The global profile spans 33 Regions and its list can
              # change, so it would have to stay wildcarded.
              #
              # InvokeModel* rather than InvokeModel, because the reader uses
              # the Converse API.
              # -------------------------------------------------------------
              - Sid: InvokeClaudeThroughTheUsGeoProfileOnly
                Effect: Allow
                Action:
                  - bedrock:InvokeModel*
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/*"
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 7

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS is also enforced in the app. Declaring it here too means a
      # preflight never reaches Lambda, which is faster and cheaper. Omitted
      # entirely until FrontendOrigin is known -- never "*", because this API
      # hands back a user's uploaded bill.
      CorsConfiguration: !If
        - HasFrontendOrigin
        - AllowOrigins: [!Ref FrontendOrigin]
          AllowMethods: [GET, POST, PUT, OPTIONS]
          AllowHeaders: [Content-Type]
          MaxAge: 600
        - !Ref AWS::NoValue

Outputs:
  ApiUrl:
    Description: Base URL for the API. Put this in the frontend's VITE_API_BASE.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UploadBucketName:
    Description: Uploads land here and are deleted after one day.
    Value: !Ref UploadBucket

  BillsTableName:
    Description: Bill records, TTL one day.
    Value: !Ref BillsTable

  FunctionName:
    Description: >
      The PHYSICAL function name, for the CloudWatch console and `aws logs`.
      NOT for `sam logs -n`, which wants the LOGICAL id instead:
        sam logs -n ApiFunction --stack-name billsahi
      Passing this value there fails with "Resource name does not exist".
    Value: !Ref ApiFunction
