[pytest]
testpaths = tests
pythonpath = scripts backend

# DeprecationWarnings in OUR code are errors -- they are how a quiet breakage
# announces itself before it becomes a bug. Third-party internals we do not
# control are ignored by module, narrowly, rather than by turning the whole
# setting off.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore::UserWarning:starlette.*
