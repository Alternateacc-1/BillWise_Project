# Run: ruff check backend/ scripts/ eval/ tests/
#
# Pinned here so the result is the same on every machine. Without a config the
# rule set depends on which ruff version you happen to have.

target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]

# The FURB family is deliberately off. FURB157 rewrites Decimal("0") to
# Decimal(0), and this codebase always builds a Decimal from a string --
# Decimal(0.1) is not one tenth, Decimal("0.1") is. The rule would teach the
# opposite habit in money code.
