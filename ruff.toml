# Lint configuration. Run: ruff check backend/ scripts/ eval/ tests/
#
# Without this file the rule set depends on whichever ruff version you happen
# to have, so the same code lints clean on one machine and reports hundreds of
# findings on another. Pinning the selection here makes the result the same for
# everyone.

target-version = "py312"
line-length = 100

[lint]
# Ruff's long-standing default: pycodestyle errors and Pyflakes.
select = ["E4", "E7", "E9", "F"]

# DELIBERATELY NOT ENABLED: the `FURB` family, specifically FURB157
# ("verbose-decimal-constructor"), which rewrites Decimal("0") to Decimal(0).
#
# This codebase handles money, and it has one rule about it: a Decimal is
# ALWAYS built from a string. Decimal(0.1) is not one tenth -- it is
# 0.1000000000000000055511151231257827, because the float is converted
# faithfully. Decimal("0.1") is exact. The quoted form is correct everywhere,
# the bare form is correct only for integers, and a convention that holds
# everywhere is worth more than 141 saved characters.
#
# Enabling FURB157 would teach the opposite habit in the one place it is most
# expensive to get wrong.
